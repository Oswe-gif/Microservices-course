spring:
  application:
    name: "configserver"
  profiles:
    #active: native
    active: git

  cloud:
    config:
      server:
        #native:
        #  search-locations: "classpath:/config"
        git:
          uri: "https://github.com/Oswe-gif/Java-Course-config.git"
          default-label: main
          timeout: 30
          clone-on-start: true
          force-pull: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
server:
  port: 8071

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"